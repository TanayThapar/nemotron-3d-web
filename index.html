<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA Nemotron 3 Ultra — Spatial OS</title>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne (Display Header) + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --nvidia-green: #76b900;
            --nvidia-teal: #0f766e;
            --bg-dark: #020617;
        }

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-sizing: border-box;
        }

        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #f8fafc;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 1. Spatial Glass Depth & Lighting Model */
        .spatial-glass {
            background: linear-gradient(
                135deg,
                rgba(15, 23, 42, 0.65) 0%,
                rgba(2, 6, 23, 0.75) 100%
            );
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.22); /* Directional top-left light highlight */
            border-left: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 18px 36px -18px rgba(2, 6, 23, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 -1px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Ambient Shimmer Light-Sweep Overlay */
        .spatial-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 100%
            );
            transform: skewX(-25deg);
            animation: lightSweep 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        @keyframes lightSweep {
            0% { left: -150%; }
            30%, 100% { left: 150%; }
        }

        /* Focus & Interaction State Lighting Shift */
        .scene-focused .spatial-glass {
            border-color: rgba(118, 185, 0, 0.4);
            box-shadow: 
                0 30px 70px -10px rgba(118, 185, 0, 0.15),
                0 0 40px rgba(118, 185, 0, 0.2),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
        }

        .glass-input-wrapper {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-input-wrapper:focus-within {
            border-color: #76b900;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 30px rgba(118, 185, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* 3D Magnetic Interactive Chips */
        .chip-interactive {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .chip-interactive:hover {
            background: rgba(118, 185, 0, 0.18);
            border-color: rgba(118, 185, 0, 0.5);
            color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(118, 185, 0, 0.3);
        }

        /* Bubbles */
        .user-bubble {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.28), rgba(15, 23, 42, 0.45));
            border: 1px solid rgba(96, 165, 250, 0.35);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .assistant-bubble {
            background: linear-gradient(135deg, rgba(118, 185, 0, 0.18), rgba(15, 23, 42, 0.5));
            border: 1px solid rgba(118, 185, 0, 0.4);
            box-shadow: 0 10px 30px rgba(118, 185, 0, 0.18);
        }

        .glow-nvidia {
            filter: drop-shadow(0 0 18px rgba(118, 185, 0, 0.65));
        }

        /* Easing & Smooth Transitions */
        .custom-bounce {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        pre {
            background: rgba(2, 6, 23, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.85rem;
            padding: 1rem;
            margin: 0.75rem 0;
            overflow-x: auto;
        }

        code {
            color: #a7f3d0;
        }
    </style>
</head>
<body id="app-body" class="h-screen w-screen flex items-center justify-center relative select-none p-4 md:p-8">

    <!-- WebGL 3D Background -->
    <div id="canvas-container"></div>

    <!-- Spatial 3D OS Interface -->
    <main class="relative z-10 w-full max-w-6xl h-[92vh] spatial-glass rounded-3xl flex flex-col justify-between">
        
        <!-- Header -->
        <header class="px-6 md:px-8 py-4 flex items-center justify-between border-b border-white/10 bg-slate-950/30 backdrop-blur-md">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#76b900] via-emerald-400 to-teal-400 flex items-center justify-center shadow-lg shadow-[#76b900]/40 glow-nvidia">
                    <svg class="w-7 h-7 text-black" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-syne text-xl md:text-2xl font-extrabold text-white tracking-wide flex items-center gap-3">
                        NVIDIA Nemotron 3 Ultra
                        <span class="text-xs font-sans px-3 py-1 rounded-full bg-[#76b900]/25 text-[#76b900] border border-[#76b900]/50 font-bold">550B MoE</span>
                    </h1>
                    <p class="text-xs text-slate-400 font-medium flex items-center gap-2 mt-0.5">
                        <span id="ambient-indicator" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Spatial GLSL Canvas • Hybrid LatentMoE Engine
                    </p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-3">
                <div id="status-pill" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-semibold">
                    <span>Ready</span>
                </div>
                <button onclick="clearChat()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition border border-white/15 text-xs font-semibold flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Clear
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
            <!-- Welcome Assistant Card -->
            <div class="flex items-start space-x-4 assistant-bubble p-6 rounded-3xl max-w-3xl">
                <div class="w-9 h-9 rounded-2xl bg-[#76b900] flex items-center justify-center text-black font-extrabold text-base shrink-0 glow-nvidia">
                    N
                </div>
                <div class="space-y-3 text-sm text-slate-200 leading-relaxed">
                    <h2 class="font-syne font-bold text-[#76b900] text-lg">Nemotron 3 Ultra Spatial OS</h2>
                    <p>Welcome. I am NVIDIA's frontier 550B hybrid Mixture-of-Experts reasoning model. How can I assist your workflow today?</p>

                    <!-- Starter Chips -->
                    <div class="pt-2 flex flex-wrap gap-2">
                        <button onclick="usePrompt('Explain quantum computing algorithms in simple terms.')" class="chip-interactive px-3.5 py-1.5 rounded-xl text-xs text-slate-300 font-medium">⚛️ Quantum Computing</button>
                        <button onclick="usePrompt('Write a Python script for real-time video streaming with OpenCV.')" class="chip-interactive px-3.5 py-1.5 rounded-xl text-xs text-slate-300 font-medium">🐍 OpenCV Streaming</button>
                        <button onclick="usePrompt('Explain Mixture-of-Experts (MoE) vs Dense Transformer architectures.')" class="chip-interactive px-3.5 py-1.5 rounded-xl text-xs text-slate-300 font-medium">🧠 MoE vs Dense</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Glass Input Bar -->
        <div class="p-6 bg-slate-950/40 backdrop-blur-2xl border-t border-white/10">
            <form id="chat-form" onsubmit="handleSend(event)" class="relative flex items-center max-w-5xl mx-auto">
                <div class="w-full rounded-2xl glass-input-wrapper flex items-center px-4 py-2">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Ask Nemotron 3 Ultra anything..." 
                        autocomplete="off"
                        onfocus="onInputFocus()"
                        onblur="onInputBlur()"
                        class="w-full h-12 bg-transparent text-white placeholder-slate-400 text-sm focus:outline-none pr-32"
                    />
                    <button 
                        type="submit" 
                        id="send-btn"
                        class="absolute right-3 px-6 h-11 rounded-xl bg-gradient-to-r from-[#76b900] via-emerald-400 to-teal-400 hover:from-emerald-400 hover:to-[#76b900] text-slate-950 font-extrabold text-sm transition-all duration-300 shadow-xl shadow-[#76b900]/40 hover:scale-105 active:scale-95 flex items-center gap-2"
                    >
                        <span>Ask</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Custom GLSL Shader & WebGL Engine -->
    <script>
        let scene, camera, renderer, particles, orbMesh, innerWireMesh;
        let particlePositions, particleVelocities, originalPositions;
        let shaderMaterial;
        let isPaused = false;
        let isStreaming = false;
        let isFocused = false;
        let rippleTime = 0;
        let rippleActive = false;

        const count = window.innerWidth < 768 ? 600 : 1200; // Responsive particle scaling

        // Target mouse and smooth current mouse for RAF throttling
        const mouseTarget = new THREE.Vector2(-1000, -1000);
        const mouseCurrent = new THREE.Vector2(-1000, -1000);
        const raycaster = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        const mouseWorldPos = new THREE.Vector3();

        // Custom GLSL Shaders for Glowing Glassy Core
        const vertexShader = `
            uniform float uTime;
            uniform float uDistortion;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;

            // Simplex noise helper
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 );
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec3 displacedPosition = position + normal * snoise(position * 0.2 + uTime * 0.5) * uDistortion;
                vec4 mvPosition = modelViewMatrix * vec4(displacedPosition, 1.0);
                vViewPosition = -mvPosition.xyz;
                vWorldPosition = (modelMatrix * vec4(displacedPosition, 1.0)).xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform float uPulse;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying vec3 vWorldPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);

                // Fresnel Edge Reflection Glow
                float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 3.0);

                // Iridescent Color Shift based on view angle
                vec3 color = mix(uColorA, uColorB, fresnel + sin(uTime * 0.5) * 0.2);
                color += vec3(0.4, 0.9, 0.2) * fresnel * 1.5 * uPulse;

                gl_FragColor = vec4(color, 0.45 + fresnel * 0.5);
            }
        `;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 28;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Shader Material Core
            shaderMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uDistortion: { value: 0.6 },
                    uColorA: { value: new THREE.Color(0x0f766e) }, // Deep Teal
                    uColorB: { value: new THREE.Color(0x76b900) }, // NVIDIA Green
                    uPulse: { value: 1.0 }
                },
                transparent: true,
                wireframe: true
            });

            const coreGeo = new THREE.IcosahedronGeometry(8, 4);
            orbMesh = new THREE.Mesh(coreGeo, shaderMaterial);
            orbMesh.position.set(0, 0, -5);
            scene.add(orbMesh);

            // Inner Accent Geometry
            const innerGeo = new THREE.IcosahedronGeometry(4, 2);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0x76b900, wireframe: true, transparent: true, opacity: 0.4 });
            innerWireMesh = new THREE.Mesh(innerGeo, innerMat);
            orbMesh.add(innerWireMesh);

            // Ambient + Interactive Particle Field
            const particleGeo = new THREE.BufferGeometry();
            particlePositions = new Float32Array(count * 3);
            originalPositions = new Float32Array(count * 3);
            particleVelocities = new Float32Array(count * 3);

            for(let i = 0; i < count * 3; i += 3) {
                const x = (Math.random() - 0.5) * 130;
                const y = (Math.random() - 0.5) * 130;
                const z = (Math.random() - 0.5) * 60;

                particlePositions[i] = x;
                particlePositions[i+1] = y;
                particlePositions[i+2] = z;

                originalPositions[i] = x;
                originalPositions[i+1] = y;
                originalPositions[i+2] = z;

                particleVelocities[i] = 0;
                particleVelocities[i+1] = 0;
                particleVelocities[i+2] = 0;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            
            const particleMat = new THREE.PointsMaterial({
                size: 0.4,
                color: 0x76b900,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });
            particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // RAF Throttled Mousemove Listener
            window.addEventListener('mousemove', (e) => {
                mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseTarget.y = -(e.clientY / window.innerHeight) * 2 + 1;

                // 3D Tilt for Interactive Starter Chips
                const chips = document.querySelectorAll('.chip-interactive');
                chips.forEach(chip => {
                    const rect = chip.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    const dx = (e.clientX - cx) / (rect.width / 2);
                    const dy = (e.clientY - cy) / (rect.height / 2);
                    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) {
                        chip.style.transform = `perspective(500px) rotateX(${-dy * 12}deg) rotateY(${dx * 12}deg) translateZ(6px)`;
                    } else {
                        chip.style.transform = 'perspective(500px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
                    }
                });
            });

            // Page Visibility API Optimization
            document.addEventListener('visibilitychange', () => {
                isPaused = document.hidden;
            });

            animate(0);
        }

        let lastTime = 0;

        function animate(timestamp) {
            if (!isPaused) {
                const delta = (timestamp - lastTime) * 0.001;
                lastTime = timestamp;
                const time = timestamp * 0.001;

                // Smooth mouse interpolation (LERP)
                mouseCurrent.lerp(mouseTarget, 0.08);

                // 1. Core Idle Animation (Orbital Drift + Rotation + Breathing Pulse)
                if (orbMesh) {
                    shaderMaterial.uniforms.uTime.value = time;
                    
                    // Idle rotation + cursor proximity bias
                    orbMesh.rotation.y = time * 0.15 + mouseCurrent.x * 0.35;
                    orbMesh.rotation.x = time * 0.1 + (-mouseCurrent.y) * 0.35;
                    
                    // Orbital drift
                    orbMesh.position.y = Math.sin(time * 0.8) * 0.8;
                    orbMesh.position.x = Math.cos(time * 0.5) * 0.5;

                    // Response streaming / Focus pulse shift
                    const targetPulse = isStreaming ? 2.2 + Math.sin(time * 8.0) * 0.5 : (isFocused ? 1.6 : 1.0);
                    shaderMaterial.uniforms.uPulse.value += (targetPulse - shaderMaterial.uniforms.uPulse.value) * 0.05;

                    innerWireMesh.rotation.z = -time * 0.3;
                }

                // 2. Mouse Position Raycasting in 3D Space
                raycaster.setFromCamera(mouseCurrent, camera);
                raycaster.ray.intersectPlane(plane, mouseWorldPos);

                // 3. Particle Physics (Ambient Drift + Repulsion + Delight Ripple)
                const positions = particles.geometry.attributes.position.array;

                if (rippleActive) {
                    rippleTime += 0.4;
                    if (rippleTime > 120) {
                        rippleActive = false;
                        rippleTime = 0;
                    }
                }

                for (let i = 0; i < count * 3; i += 3) {
                    const px = positions[i];
                    const py = positions[i+1];
                    const pz = positions[i+2];

                    const ox = originalPositions[i];
                    const oy = originalPositions[i+1];
                    const oz = originalPositions[i+2];

                    // Baseline Ambient Drift
                    const ambientNoise = Math.sin(time * 1.5 + ox) * 0.03;
                    positions[i+1] += ambientNoise;

                    // Cursor Repulsion / Focus Attraction
                    const dx = px - mouseWorldPos.x;
                    const dy = py - mouseWorldPos.y;
                    const distSq = dx * dx + dy * dy;
                    const radius = isFocused ? 26 : 18;

                    if (distSq < radius * radius && distSq > 0) {
                        const dist = Math.sqrt(distSq);
                        const force = (radius - dist) / radius;
                        const factor = isFocused ? -0.8 : 1.4; // Attract on focus, repel on normal hover
                        
                        particleVelocities[i] += (dx / dist) * force * factor;
                        particleVelocities[i+1] += (dy / dist) * force * factor;
                    }

                    // Delight Wave Ripple from 3D Core
                    if (rippleActive) {
                        const distFromCenter = Math.sqrt(px * px + py * py);
                        if (Math.abs(distFromCenter - rippleTime) < 4) {
                            particleVelocities[i+2] += 1.5;
                        }
                    }

                    // Elastic return to baseline
                    particleVelocities[i] += (ox - px) * 0.03;
                    particleVelocities[i+1] += (oy - py) * 0.03;
                    particleVelocities[i+2] += (oz - pz) * 0.03;

                    // Damping
                    particleVelocities[i] *= 0.86;
                    particleVelocities[i+1] *= 0.86;
                    particleVelocities[i+2] *= 0.86;

                    // Apply velocities
                    positions[i] += particleVelocities[i];
                    positions[i+1] += particleVelocities[i+1];
                    positions[i+2] += particleVelocities[i+2];
                }

                particles.geometry.attributes.position.needsUpdate = true;
                renderer.render(scene, camera);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();
    </script>

    <!-- Chat & Interaction Logic -->
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const statusPill = document.getElementById('status-pill');

        let messageHistory = [];

        function onInputFocus() {
            isFocused = true;
            document.body.classList.add('scene-focused');
        }

        function onInputBlur() {
            isFocused = false;
            document.body.classList.remove('scene-focused');
        }

        function triggerDelightRipple() {
            rippleTime = 0;
            rippleActive = true;
        }

        function usePrompt(text) {
            userInput.value = text;
            userInput.focus();
        }

        async function handleSend(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendUserMessage(text);
            messageHistory.push({ role: "user", content: text });

            // Trigger 3D Core Shockwave Delight Wave
            triggerDelightRipple();

            // Create Nemotron Loading Card
            const assistantCard = createAssistantCardPlaceholder();
            chatMessages.appendChild(assistantCard);
            scrollToBottom();

            isStreaming = true;
            setStatus("Reasoning...", "bg-amber-500/15 border-amber-500/40 text-amber-400");

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "nvidia/nemotron-3-ultra-550b-a55b:free",
                        messages: messageHistory
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    messageHistory.push({ role: "assistant", content: reply });
                    updateAssistantCard(assistantCard, reply);
                } else if (data.error) {
                    updateAssistantCard(assistantCard, `⚠️ Error: ${data.error.message || 'API request failed'}`);
                } else {
                    updateAssistantCard(assistantCard, "⚠️ Unexpected response format from server.");
                }
            } catch (err) {
                updateAssistantCard(assistantCard, `❌ Failed to connect to server: ${err.message}`);
            }

            isStreaming = false;
            setStatus("Ready", "bg-emerald-500/15 border-emerald-500/40 text-emerald-400");
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex items-start justify-end space-x-3 ml-auto max-w-2xl custom-bounce';
            div.innerHTML = `
                <div class="user-bubble p-5 rounded-3xl text-sm text-white leading-relaxed">
                    ${escapeHtml(text)}
                </div>
            `;
            chatMessages.appendChild(div);
            scrollToBottom();
        }

        function createAssistantCardPlaceholder() {
            const div = document.createElement('div');
            div.className = 'flex items-start space-x-4 assistant-bubble p-6 rounded-3xl max-w-3xl animate-pulse custom-bounce';
            div.innerHTML = `
                <div class="w-9 h-9 rounded-2xl bg-[#76b900] flex items-center justify-center text-black font-extrabold text-base shrink-0 glow-nvidia">
                    N
                </div>
                <div class="content space-y-2 text-sm text-slate-300 leading-relaxed">
                    <p class="text-xs text-[#76b900] font-bold tracking-wider uppercase">Nemotron 3 Ultra is reasoning...</p>
                </div>
            `;
            return div;
        }

        function updateAssistantCard(card, markdownContent) {
            card.classList.remove('animate-pulse');
            const contentDiv = card.querySelector('.content');
            contentDiv.innerHTML = marked.parse(markdownContent);
            scrollToBottom();
        }

        function setStatus(text, classes) {
            statusPill.className = `flex items-center space-x-2 px-3.5 py-1.5 rounded-full text-xs font-semibold ${classes}`;
            statusPill.querySelector('span:last-child').textContent = text;
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            messageHistory = [];
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
