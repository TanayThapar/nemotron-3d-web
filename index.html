<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nemotron 3 Ultra — Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --primary:       #2563EB;
      --primary-dark:  #1D4ED8;
      --secondary:     #64748B;
      --accent:        #10B981;
      --danger:        #EF4444;

      --bg:            #F8FAFC;
      --surface:       #FFFFFF;
      --surface-2:     #F1F5F9;
      --border:        #E2E8F0;
      --border-strong: #CBD5E1;

      --text-primary:  #0F172A;
      --text-secondary:#475569;
      --text-muted:    #94A3B8;

      --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:  0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
      --shadow-lg:  0 12px 32px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);

      --radius-sm:  6px;
      --radius-md:  10px;
      --radius-lg:  14px;
      --radius-xl:  20px;
      --radius-pill:9999px;

      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;

      --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);

      --header-h: 56px;
      --input-area-h: 100px;
      --max-w: 860px;
    }

    /* ─── Dark Mode Tokens ──────────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg:            #0B1120;
      --surface:       #111827;
      --surface-2:     #1E293B;
      --border:        #1E293B;
      --border-strong: #334155;

      --text-primary:  #F1F5F9;
      --text-secondary:#94A3B8;
      --text-muted:    #475569;

      --shadow-sm:  0 1px 3px rgba(0,0,0,.3);
      --shadow-md:  0 4px 12px rgba(0,0,0,.4);
      --shadow-lg:  0 12px 32px rgba(0,0,0,.5);
    }

    /* ─── Reset & Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg);
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
    }

    /* ─── Three.js Canvas ───────────────────────────────────────────────── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .18;
      transition: opacity var(--transition);
    }
    [data-theme="dark"] #bg-canvas { opacity: .28; }
    @media (prefers-reduced-motion: reduce) { #bg-canvas { display: none; } }

    /* ─── Layout Shell ──────────────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ─── Top Bar ────────────────────────────────────────────────────────── */
    #topbar {
      flex-shrink: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 16px;
    }

    #logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    #logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #76b900, #10B981);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    #logo-icon svg { width: 18px; height: 18px; }
    #logo-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }
    @media (max-width: 480px) { #logo-text { display: none; } }

    #topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Pill Buttons (Header) ─────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font);
      font-size: 13px; font-weight: 500;
      line-height: 1;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      cursor: pointer;
      background: var(--surface);
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), color var(--transition), transform var(--transition-bounce), box-shadow var(--transition);
    }
    .btn:hover {
      background: var(--surface-2);
      color: var(--text-primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* Theme toggle */
    #theme-toggle svg { width: 16px; height: 16px; }

    /* Status badge */
    #status-badge {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0;
      transition: all var(--transition);
    }
    [data-theme="dark"] #status-badge { background: rgba(16,185,129,.15); color: #34D399; border-color: rgba(16,185,129,.3); }
    #status-badge.loading { background: #FEF3C7; color: #92400E; border-color: #FDE68A; }
    [data-theme="dark"] #status-badge.loading { background: rgba(245,158,11,.15); color: #FCD34D; border-color: rgba(245,158,11,.3); }

    /* ─── Chat Area ──────────────────────────────────────────────────────── */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 24px 0;
    }
    #chat-scroll::-webkit-scrollbar { width: 5px; }
    #chat-scroll::-webkit-scrollbar-track { background: transparent; }
    #chat-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* ─── Welcome Card ─────────────────────────────────────────────────── */
    #welcome-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px 32px;
      box-shadow: var(--shadow-md);
    }
    #welcome-card h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    #welcome-card p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    /* ─── Prompt Chips ─────────────────────────────────────────────────── */
    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: background var(--transition), color var(--transition), transform var(--transition-bounce), box-shadow var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37,99,235,.25);
    }
    .chip:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ─── Chat Bubbles ─────────────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 12px;
      animation: msgIn 220ms cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg-row { animation: none; }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      margin-top: 2px;
    }
    .msg-avatar.n-avatar {
      background: linear-gradient(135deg, #76b900, #10B981);
      color: #fff;
    }
    .msg-avatar.u-avatar {
      background: var(--primary);
      color: #fff;
    }

    .msg-bubble {
      max-width: min(75%, 640px);
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      line-height: 1.65;
      box-shadow: var(--shadow-sm);
    }
    .msg-row.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: var(--radius-sm);
    }
    .msg-row.user .msg-bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: var(--radius-sm);
    }

    /* Markdown in bubbles */
    .msg-bubble p { margin-bottom: 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      overflow-x: auto;
      margin: 10px 0;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
    }
    [data-theme="dark"] .msg-bubble pre { background: #0B1120; }
    .msg-bubble code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: rgba(99,102,241,.1);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .msg-bubble pre code { background: transparent; padding: 0; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin-bottom: 10px; }
    .msg-row.user .msg-bubble pre,
    .msg-row.user .msg-bubble code { background: rgba(255,255,255,.15); color: #fff; }

    /* ─── Skeleton / Loading ───────────────────────────────────────────── */
    .skeleton-bubble {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      max-width: 300px;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--border) 25%, var(--surface-2) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @media (prefers-reduced-motion: reduce) { .skeleton-line { animation: none; } }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .skeleton-line:nth-child(1) { width: 80%; }
    .skeleton-line:nth-child(2) { width: 60%; }
    .skeleton-line:nth-child(3) { width: 70%; }

    /* ─── Input Area ─────────────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      padding: 12px 0 16px;
      border-top: 1px solid var(--border);
    }
    #input-form {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #input-wrap {
      flex: 1;
      position: relative;
      background: var(--surface);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    #input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    #user-input {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 120px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      resize: none;
      font-family: var(--font);
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      border-radius: var(--radius-xl);
      overflow-y: auto;
      line-height: 1.55;
    }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md);
      transition: background var(--transition), transform var(--transition-bounce), box-shadow var(--transition), opacity var(--transition);
    }
    #send-btn svg { width: 18px; height: 18px; }
    #send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,99,235,.35);
    }
    #send-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }
    #send-btn:active:not(:disabled) { transform: scale(.95); }

    /* ─── Toast ─────────────────────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      color: var(--text-primary);
      pointer-events: all;
      animation: toastIn 220ms cubic-bezier(0.4,0,0.2,1) both;
      max-width: 380px;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .toast.error { border-color: #FECACA; background: #FFF5F5; color: #991B1B; }
    [data-theme="dark"] .toast.error { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #FCA5A5; }
    .toast-icon { font-size: 16px; flex-shrink: 0; }
    .toast-msg { flex: 1; }
    .toast-close {
      border: none; background: none; cursor: pointer;
      color: inherit; opacity: .6; font-size: 16px; line-height: 1;
      padding: 2px 4px; border-radius: 4px;
    }
    .toast-close:hover { opacity: 1; }

    /* ─── Gradient BG fallback (reduced-motion) ─────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      body {
        background: var(--bg);
      }
    }

    /* ─── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      #chips { flex-direction: column; }
      .chip { width: 100%; justify-content: center; }
      .msg-bubble { font-size: 14px; }
      #welcome-card { padding: 20px; }
    }
  </style>
</head>
<body>

<!-- Three.js WebGL background -->
<canvas id="bg-canvas" aria-hidden="true"></canvas>

<!-- Toast container -->
<div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<div id="app">

  <!-- Top Bar -->
  <header id="topbar" role="banner">
    <a id="logo" href="#" aria-label="Nemotron 3 Ultra Home">
      <div id="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span id="logo-text">Nemotron&nbsp;3&nbsp;Ultra</span>
    </a>

    <div id="topbar-right">
      <span id="status-badge" role="status" aria-live="polite">Ready</span>

      <button class="btn" id="clear-btn" aria-label="Clear chat history" onclick="clearChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        <span class="hide-xs">Clear</span>
      </button>

      <button class="btn" id="theme-toggle" aria-label="Toggle light/dark mode" onclick="toggleTheme()">
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Chat Scroll Area -->
  <section id="chat-scroll" aria-label="Conversation" role="log" aria-live="polite">
    <div id="messages">

      <!-- Welcome Card -->
      <div id="welcome-card" role="region" aria-label="Welcome">
        <h2>What can I help you with?</h2>
        <p>Powered by NVIDIA Nemotron 3 Ultra — a 550B hybrid Mixture-of-Experts reasoning model.</p>
        <div id="chips" role="list" aria-label="Prompt suggestions">
          <button class="chip" role="listitem" aria-label="Ask about quantum computing" onclick="usePrompt('Explain quantum computing algorithms in simple terms.')">⚛️ Quantum computing</button>
          <button class="chip" role="listitem" aria-label="Ask about OpenCV video streaming" onclick="usePrompt('Write a Python script for real-time video streaming with OpenCV.')">🐍 OpenCV streaming</button>
          <button class="chip" role="listitem" aria-label="Ask about MoE vs Dense transformers" onclick="usePrompt('Explain Mixture-of-Experts (MoE) vs Dense Transformer architectures.')">🧠 MoE vs Dense</button>
          <button class="chip" role="listitem" aria-label="Ask about system design" onclick="usePrompt('Design a scalable microservices architecture for a high-traffic e-commerce platform.')">🏗️ System design</button>
          <button class="chip" role="listitem" aria-label="Ask for a code review" onclick="usePrompt('What are modern best practices for writing clean, maintainable Python code?')">✅ Clean code tips</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Input Area -->
  <div id="input-area">
    <form id="input-form" onsubmit="handleSend(event)">
      <div id="input-wrap">
        <textarea
          id="user-input"
          rows="1"
          placeholder="Message Nemotron 3 Ultra…"
          aria-label="Type your message"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
      </div>
      <button type="submit" id="send-btn" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

</div>

<!-- ── Three.js subtle background ────────────────────────────────────────── -->
<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas || !window.THREE) return;

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.z = 30;

  const isMobile = innerWidth < 768;
  const COUNT = isMobile ? 500 : 1000;

  // Gaussian distribution for focal density
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const cA = new THREE.Color('#76b900');
  const cB = new THREE.Color('#2dd4bf');

  for (let i = 0; i < COUNT; i++) {
    const u = Math.random(), v = Math.random();
    const r = Math.sqrt(-2 * Math.log(u)) * 28;
    const t = 2 * Math.PI * v;
    pos[i*3]   = r * Math.cos(t);
    pos[i*3+1] = r * Math.sin(t);
    pos[i*3+2] = (Math.random() - .5) * 40;
    const c = Math.random() < .8 ? cA : cB;
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.38, vertexColors: true,
    transparent: true, opacity: .9,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Subtle icosahedron core
  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(6, 3),
    new THREE.MeshBasicMaterial({ color: 0x76b900, wireframe: true, transparent: true, opacity: 0.18 })
  );
  scene.add(core);

  let raf;
  const resize = () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  };
  resize();
  window.addEventListener('resize', resize);

  // Pause when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else tick(0);
  });

  const tick = (t) => {
    raf = requestAnimationFrame(tick);
    const s = t * 0.001;
    points.rotation.y = s * 0.06;
    core.rotation.y   = s * 0.12;
    core.rotation.x   = s * 0.07;
    renderer.render(scene, camera);
  };
  tick(0);
})();
</script>

<!-- ── App Logic ────────────────────────────────────────────────────────── -->
<script>
/* ── Theme ── */
const html = document.documentElement;
const sunIcon  = document.getElementById('icon-sun');
const moonIcon = document.getElementById('icon-moon');

function applyTheme(theme) {
  html.dataset.theme = theme;
  localStorage.setItem('nemo-theme', theme);
  if (theme === 'dark') {
    sunIcon.style.display = 'block';
    moonIcon.style.display = 'none';
  } else {
    sunIcon.style.display = 'none';
    moonIcon.style.display = 'block';
  }
}

function toggleTheme() {
  applyTheme(html.dataset.theme === 'dark' ? 'light' : 'dark');
}

// Init theme from localStorage or system preference
const savedTheme = localStorage.getItem('nemo-theme');
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

/* ── Chat History Persistence ── */
const STORAGE_KEY = 'nemo-history';
let messageHistory = [];

function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messageHistory)); } catch(e) {}
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
}

/* ── DOM refs ── */
const messagesEl  = document.getElementById('messages');
const scrollEl    = document.getElementById('chat-scroll');
const inputEl     = document.getElementById('user-input');
const sendBtn     = document.getElementById('send-btn');
const statusBadge = document.getElementById('status-badge');
const welcomeCard = document.getElementById('welcome-card');

/* ── Auto-resize textarea ── */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  sendBtn.disabled = !inputEl.value.trim();
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) handleSend(e);
  }
});

/* ── Restore history ── */
(function restoreHistory() {
  messageHistory = loadHistory();
  if (!messageHistory.length) return;
  welcomeCard.style.display = 'none';
  messageHistory.forEach(m => {
    if (m.role === 'user')      appendUserMsg(m.content, false);
    else if (m.role === 'assistant') appendAssistantMsg(m.content, false);
  });
  scrollToBottom();
})();

/* ── usePrompt ── */
function usePrompt(text) {
  inputEl.value = text;
  inputEl.dispatchEvent(new Event('input'));
  inputEl.focus();
}

/* ── Send ── */
async function handleSend(e) {
  if (e.preventDefault) e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;

  // Hide welcome card on first message
  welcomeCard.style.display = 'none';

  // Reset input
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  appendUserMsg(text);
  messageHistory.push({ role: 'user', content: text });
  saveHistory();

  // Loading skeleton
  const loadingRow = createSkeletonRow();
  messagesEl.appendChild(loadingRow);
  scrollToBottom();

  setStatus('Reasoning…', true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'nvidia/nemotron-3-ultra-550b-a55b:free',
        messages: messageHistory
      })
    });

    const data = await res.json();
    loadingRow.remove();

    if (data.choices?.[0]?.message?.content) {
      const reply = data.choices[0].message.content;
      messageHistory.push({ role: 'assistant', content: reply });
      saveHistory();
      appendAssistantMsg(reply);
    } else if (data.error) {
      showToast(data.error.message || 'API error. Please try again.', 'error');
    } else {
      showToast('Unexpected response from server.', 'error');
    }
  } catch (err) {
    loadingRow.remove();
    showToast(`Connection failed: ${err.message}`, 'error');
  }

  setStatus('Ready', false);
}

/* ── Append messages ── */
function appendUserMsg(text, animate = true) {
  const row = document.createElement('div');
  row.className = 'msg-row user' + (animate ? '' : ' no-anim');
  row.innerHTML = `
    <div class="msg-avatar u-avatar" aria-hidden="true">You</div>
    <div class="msg-bubble" role="article" aria-label="Your message">${escapeHtml(text)}</div>
  `;
  messagesEl.appendChild(row);
  if (animate) scrollToBottom();
}

function appendAssistantMsg(text, animate = true) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant' + (animate ? '' : ' no-anim');
  const safeHtml = marked.parse(text);
  row.innerHTML = `
    <div class="msg-avatar n-avatar" aria-hidden="true">N</div>
    <div class="msg-bubble" role="article" aria-label="Nemotron response">${safeHtml}</div>
  `;
  messagesEl.appendChild(row);
  if (animate) scrollToBottom();
}

function createSkeletonRow() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.setAttribute('aria-label', 'Loading response');
  row.setAttribute('aria-busy', 'true');
  row.innerHTML = `
    <div class="msg-avatar n-avatar" aria-hidden="true">N</div>
    <div class="skeleton-bubble" role="status" aria-label="Nemotron is thinking">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
  `;
  return row;
}

/* ── Clear ── */
function clearChat() {
  messageHistory = [];
  saveHistory();
  messagesEl.innerHTML = '';
  messagesEl.appendChild(welcomeCard);
  welcomeCard.style.display = '';
  setStatus('Ready', false);
}

/* ── Status ── */
function setStatus(text, loading) {
  statusBadge.textContent = text;
  statusBadge.classList.toggle('loading', !!loading);
}

/* ── Toast ── */
function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.setAttribute('role', 'alert');
  toast.innerHTML = `
    <span class="toast-icon">${type === 'error' ? '⚠️' : 'ℹ️'}</span>
    <span class="toast-msg">${escapeHtml(msg)}</span>
    <button class="toast-close" aria-label="Dismiss notification" onclick="this.closest('.toast').remove()">✕</button>
  `;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 6000);
}

/* ── Helpers ── */
function scrollToBottom() {
  requestAnimationFrame(() => {
    scrollEl.scrollTop = scrollEl.scrollHeight;
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
